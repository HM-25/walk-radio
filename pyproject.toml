[project]
name = "walk-radio"
version = "0.2.0"
description = "Personal audio walk guide: OpenStreetMap + Wikipedia + local Gemma + Piper, all on your laptop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "piper-tts>=1.8.0",
    "requests>=2.34.2",
]

[project.scripts]
walkradio = "walkradio.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "walkradio"
